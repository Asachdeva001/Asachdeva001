name: Update Activity Cards

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------
      # Create activity directory
      # --------------------------------------------------
      - name: Create assets directory
        run: mkdir -p assets/activity

      # --------------------------------------------------
      # Generate Activity Cards (Upper Profile Theme)
      # --------------------------------------------------
      - name: Generate Activity Cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 scripts/generate_activity_cards.py

      # --------------------------------------------------
      # Commit generated cards
      # --------------------------------------------------
      - name: Commit and push if changed
        run: |
          git config user.name "Aashish Sachdeva"
          git config user.email "ashisach001@gmail.com"

          git add assets/activity

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update activity cards"
            git push
          fi
