<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Outer Neon Glow -->
    <filter id="neon-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#818cf8" flood-opacity="0.3"/>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .window-title {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 12px;
      fill: #64748b;
    }
    .explorer-header {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #475569;
      letter-spacing: 0.8px;
    }
    .tree-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 13px;
      fill: #94a3b8;
    }
    .tree-text-active {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .tree-text-inactive {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 13px;
      fill: #64748b;
    }
    .tab-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .tab-text-active {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .code-text {
      font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      line-height: 20px;
    }
    .status-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11px;
      fill: #475569;
    }
    .status-text-white {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11px;
      fill: #94a3b8;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg-grad)" />

  <!-- ================= IDE WINDOW CONTAINER ================= -->
  <!-- Neon Glow Backplate -->
  <rect x="40" y="25" width="1120" height="430" rx="12" fill="none" stroke="#6366f1" stroke-width="1.5" filter="url(#neon-glow)" opacity="0.3"/>
  <!-- Main Glass Card -->
  <rect x="40" y="25" width="1120" height="430" rx="12" fill="#070a13" fill-opacity="0.95" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- ================= WINDOW HEADER ================= -->
  <!-- Top bar path (rounded corners) -->
  <path d="M 40 37 A 12 12 0 0 1 52 25 L 1148 25 A 12 12 0 0 1 1160 37 L 1160 60 L 40 60 Z" fill="#0b0f19" stroke="#1e293b" stroke-width="0.5"/>
  
  <!-- Window Controls -->
  <circle cx="65" cy="42" r="6" fill="#ef4444" />
  <circle cx="85" cy="42" r="6" fill="#eab308" />
  <circle cx="105" cy="42" r="6" fill="#22c55e" />

  <!-- Center Title -->
  <text x="600" y="46" text-anchor="middle" class="window-title">Aashish Sachdeva - Workspace</text>

  <!-- ================= SIDEBAR (FILE EXPLORER) ================= -->
  <!-- Sidebar Background -->
  <rect x="40" y="60" width="220" height="365" fill="#080c16" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Explorer Header -->
  <text x="55" y="85" class="explorer-header">EXPLORER</text>
  
  <!-- File Tree Roots -->
  <!-- Folder: src -->
  <g transform="translate(55, 102)" fill="#3b82f6">
    <!-- Folder Icon -->
    <path d="M1 2 L5 2 L7 4 L14 4 L14 11 L1 11 Z" opacity="0.8"/>
  </g>
  <text x="76" y="112" class="tree-text">src</text>

  <!-- Folder: profile -->
  <g transform="translate(70, 126)" fill="#3b82f6">
    <path d="M1 2 L5 2 L7 4 L14 4 L14 11 L1 11 Z" opacity="0.8"/>
  </g>
  <text x="91" y="136" class="tree-text">profile</text>

  <!-- File: education.json -->
  <g transform="translate(85, 149)">
    <rect x="0" y="0" width="13" height="13" rx="2" fill="#eab308" opacity="0.85"/>
    <text x="6.5" y="9.5" font-family="sans-serif" font-size="8.5" fill="#050814" font-weight="bold" text-anchor="middle">{}</text>
  </g>
  <text x="105" y="160" class="tree-text-inactive">education.json</text>

  <!-- File: experience.ts (ACTIVE SELECTED) -->
  <rect x="42" y="172" width="216" height="22" rx="4" fill="#0ea5e9" fill-opacity="0.12"/>
  <g transform="translate(85, 176)">
    <rect x="0" y="0" width="13" height="13" rx="2" fill="#3178c6"/>
    <text x="6.5" y="9.5" font-family="sans-serif" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">TS</text>
  </g>
  <text x="105" y="187" class="tree-text-active">experience.ts</text>

  <!-- File: contact.md -->
  <g transform="translate(85, 201)">
    <rect x="0" y="0" width="13" height="13" rx="2" fill="#0f766e" opacity="0.8"/>
    <text x="6.5" y="9.5" font-family="sans-serif" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">M↓</text>
  </g>
  <text x="105" y="212" class="tree-text-inactive">contact.md</text>


  <!-- ================= EDITOR TAB BAR ================= -->
  <rect x="260" y="60" width="900" height="30" fill="#090d16" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Active Tab: experience.ts -->
  <path d="M 260 90 L 260 65 A 4 4 0 0 1 264 61 L 396 61 A 4 4 0 0 1 400 65 L 400 90 Z" fill="#070a13"/>
  <rect x="260" y="60" width="140" height="2" fill="#38bdf8"/> <!-- Tab active border top -->
  <!-- TS Icon in tab -->
  <g transform="translate(272, 69)">
    <rect x="0" y="0" width="12" height="12" rx="1.5" fill="#3178c6"/>
    <text x="6" y="9" font-family="sans-serif" font-size="6.5" fill="#fff" font-weight="bold" text-anchor="middle">TS</text>
  </g>
  <text x="290" y="79" class="tab-text-active">experience.ts</text>
  <!-- Close Icon 'x' -->
  <text x="382" y="78" font-family="sans-serif" font-size="10" fill="#475569">×</text>

  <!-- Inactive Tab: education.json -->
  <path d="M 400 90 L 400 66 A 4 4 0 0 1 404 62 L 536 62 A 4 4 0 0 1 540 66 L 540 90 Z" fill="#090d16" opacity="0.6"/>
  <!-- JSON Icon in tab -->
  <g transform="translate(412, 70)">
    <rect x="0" y="0" width="12" height="12" rx="1.5" fill="#eab308" opacity="0.7"/>
    <text x="6" y="9" font-family="sans-serif" font-size="8" fill="#050814" font-weight="bold" text-anchor="middle">{}</text>
  </g>
  <text x="430" y="79" class="tab-text">education.json</text>


  <!-- ================= CODE EDITOR AREA ================= -->
  <!-- Active Editor Workspace -->
  <rect x="260" y="90" width="900" height="335" fill="#070a13"/>

  <!-- Active Line Highlight (Line 14) -->
  <rect x="261" y="344" width="898" height="20" fill="#1e293b" fill-opacity="0.35"/>

  <!-- Line Numbers -->
  <g fill="#334155" font-family="Consolas, Fira Code, Monaco, monospace" font-size="13" text-anchor="end">
    <text x="295" y="113">1</text>
    <text x="295" y="133">2</text>
    <text x="295" y="153">3</text>
    <text x="295" y="173">4</text>
    <text x="295" y="193">5</text>
    <text x="295" y="213">6</text>
    <text x="295" y="233">7</text>
    <text x="295" y="253">8</text>
    <text x="295" y="273">9</text>
    <text x="295" y="293">10</text>
    <text x="295" y="313">11</text>
    <text x="295" y="333">12</text>
    <text x="295" y="353">13</text>
    <text x="295" y="373">14</text>
    <text x="295" y="393">15</text>
    <text x="295" y="413">16</text>
  </g>

  <!-- Code Syntax Highlighted Text -->
  <g class="code-text" font-family="Consolas, Fira Code, Monaco, monospace" font-size="13.5">
    
    <!-- Line 1 -->
    <text x="315" y="113">
      <tspan fill="#f43f5e">import</tspan>
      <tspan fill="#cbd5e1"> { </tspan>
      <tspan fill="#60a5fa">Developer</tspan>
      <tspan fill="#cbd5e1">, </tspan>
      <tspan fill="#60a5fa">Intern</tspan>
      <tspan fill="#cbd5e1"> } </tspan>
      <tspan fill="#f43f5e">from</tspan>
      <tspan fill="#34d399"> './profile'</tspan>
      <tspan fill="#94a3b8">;</tspan>
    </text>

    <!-- Line 2 -->
    <text x="315" y="133"></text>

    <!-- Line 3 (Comment) -->
    <text x="315" y="153" fill="#475569" font-style="italic">// Computer Science undergraduate @ PEC, Chandigarh</text>

    <!-- Line 4 -->
    <text x="315" y="173">
      <tspan fill="#f43f5e">const</tspan>
      <tspan fill="#e2e8f0"> developer </tspan>
      <tspan fill="#f43f5e">=</tspan>
      <tspan fill="#e2e8f0"> {</tspan>
    </text>

    <!-- Line 5 -->
    <text x="315" y="193">
      <tspan fill="#94a3b8">  name:</tspan>
      <tspan fill="#34d399"> 'Aashish Sachdeva'</tspan>
      <tspan fill="#94a3b8">,</tspan>
    </text>

    <!-- Line 6 -->
    <text x="315" y="213">
      <tspan fill="#94a3b8">  focus:</tspan>
      <tspan fill="#e2e8f0"> [</tspan>
      <tspan fill="#34d399">'scalable systems'</tspan>
      <tspan fill="#cbd5e1">, </tspan>
      <tspan fill="#34d399">'cloud architecture'</tspan>
      <tspan fill="#cbd5e1">, </tspan>
      <tspan fill="#34d399">'fullstack development'</tspan>
      <tspan fill="#e2e8f0">]</tspan>
    </text>

    <!-- Line 7 -->
    <text x="315" y="233" fill="#e2e8f0">};</text>

    <!-- Line 8 -->
    <text x="315" y="253"></text>

    <!-- Line 9 -->
    <text x="315" y="273">
      <tspan fill="#f472b6">export</tspan>
      <tspan fill="#f43f5e"> const</tspan>
      <tspan fill="#e2e8f0"> experience: </tspan>
      <tspan fill="#60a5fa">Intern</tspan>
      <tspan fill="#cbd5e1">[] </tspan>
      <tspan fill="#f43f5e">=</tspan>
      <tspan fill="#cbd5e1"> [{</tspan>
    </text>

    <!-- Line 10 -->
    <text x="315" y="293">
      <tspan fill="#94a3b8">  company:</tspan>
      <tspan fill="#34d399"> 'Growero.io'</tspan>
      <tspan fill="#94a3b8">,</tspan>
    </text>

    <!-- Line 11 -->
    <text x="315" y="313">
      <tspan fill="#94a3b8">  role:</tspan>
      <tspan fill="#34d399"> 'Full Stack Web Developer Intern'</tspan>
      <tspan fill="#94a3b8">,</tspan>
    </text>

    <!-- Line 12 -->
    <text x="315" y="333">
      <tspan fill="#94a3b8">  achievements: </tspan>
      <tspan fill="#e2e8f0">[</tspan>
    </text>

    <!-- Line 13 -->
    <text x="315" y="353">
      <tspan fill="#34d399">    'Optimized async APIs, reducing load times by 40%'</tspan>
      <tspan fill="#94a3b8">,</tspan>
    </text>

    <!-- Line 14 -->
    <text x="315" y="373">
      <tspan fill="#34d399">    'Led CI/CD automation to achieve 25% faster releases'</tspan>
    </text>

    <!-- Line 15 -->
    <text x="315" y="393">
      <tspan fill="#cbd5e1">  ]</tspan>
    </text>

    <!-- Line 16 -->
    <text x="315" y="413" fill="#e2e8f0">}];</text>

  </g>

  <!-- Blinking Cursor in Editor (Line 14, column end) -->
  <!-- '    'Led CI/CD automation to achieve 25% faster releases'' has 58 characters including indentation. -->
  <!-- 315 + 58 * 7.7 (average char width) = 315 + 446 = 761 -->
  <rect x="765" y="360" width="1.5" height="15" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
  </rect>

  <!-- ================= STATUS BAR ================= -->
  <path d="M 40 425 L 1160 425 L 1160 443 A 12 12 0 0 1 1148 455 L 52 455 A 12 12 0 0 1 40 443 Z" fill="#0b0f19" stroke="#1e293b" stroke-width="0.5"/>
  
  <!-- Left Side info -->
  <!-- Git Branch Icon and text -->
  <g transform="translate(55, 433)">
    <!-- Branch Icon path -->
    <path d="M3 5 C3 3.9 3.9 3 5 3 C6.1 3 7 3.9 7 5 C7 5.7 6.6 6.3 6 6.7 L6 9.3 C6.6 9.7 7 10.3 7 11 C7 12.1 6.1 13 5 13 C3.9 13 3 12.1 3 11 C3 10.3 3.4 9.7 4 9.3 L4 6.7 C3.4 6.3 3 5.7 3 5 M5 4 C4.4 4 4 4.4 4 5 C4 5.6 4.4 6 5 6 C5.6 6 6 5.6 6 5 C6 4.4 5.6 4 5 4 M5 10 C4.4 10 4 10.4 4 11 C4 11.6 4.4 12 5 12 C5.6 12 6 11.6 6 11 C6 10.4 5.6 10 5 10" fill="#475569"/>
    <text x="12" y="10" class="status-text-white">main</text>
  </g>
  <text x="105" y="443" class="status-text">•</text>
  <text x="120" y="443" class="status-text">0 Problems</text>

  <!-- Right Side info -->
  <g text-anchor="end">
    <text x="1145" y="443" class="status-text-white">TypeScript</text>
    <text x="1060" y="443" class="status-text">UTF-8</text>
    <text x="980" y="443" class="status-text">Ln 14, Col 56</text>
  </g>

</svg>
