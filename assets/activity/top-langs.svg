<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top Languages Used">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3178c6" flood-opacity="0.4"/>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#facc15" flood-opacity="0.4"/>
    </filter>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#a855f7" flood-opacity="0.4"/>
    </filter>
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#34d399" flood-opacity="0.4"/>
    </filter>
    <filter id="orange-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ef4444" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .terminal-title {
      font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      fill: #64748b;
      font-weight: 500;
    }
    .prompt-text {
      font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
      font-size: 16px;
      fill: #38bdf8;
      font-weight: 600;
    }
    .status-text-green {
      font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      fill: #34d399;
    }
    .metric-value {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-weight: 700;
      fill: #f0f6fc;
    }
    .metric-label {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #94a3b8;
      letter-spacing: 0.8px;
    }
    .metric-subtext {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11px;
      fill: #64748b;
    }
    .grid-lines {
      fill: none;
      stroke: #1e293b;
      stroke-width: 0.8;
      stroke-dasharray: 4 4;
      opacity: 0.3;
    }
    .tile-bg {
      fill: #090d16;
      fill-opacity: 0.85;
      stroke: #1e293b;
      stroke-width: 1.5;
    }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="340" fill="url(#bg-grad)" />

  <!-- Ambient Grid Lines -->
  <g class="grid-lines">
    <path d="M 0,40 L 1200,40 M 0,80 L 1200,80 M 0,120 L 1200,120 M 0,160 L 1200,160 M 0,200 L 1200,200 M 0,240 L 1200,240 M 0,280 L 1200,280 M 0,320 L 1200,320" />
    <path d="M 100,0 L 100,340 M 200,0 L 200,340 M 300,0 L 300,340 M 400,0 L 400,340 M 500,0 L 500,340 M 600,0 L 600,340 M 700,0 L 700,340 M 800,0 L 800,340 M 900,0 L 900,340 M 1000,0 L 1000,340 M 1100,0 L 1100,340" />
  </g>

  <!-- Glowing Particles in Background -->
  <circle cx="120" cy="80" r="60" fill="#06b6d4" fill-opacity="0.07" filter="url(#glow)">
    <animate attributeName="cx" values="120;220;120" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="260" r="70" fill="#a855f7" fill-opacity="0.06" filter="url(#glow)">
    <animate attributeName="cx" values="1080;980;1080" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer Glow Border -->
  <rect x="40" y="25" width="1120" height="290" rx="12" fill="none" stroke="#3178c6" stroke-width="1.5" filter="url(#neon-glow)" opacity="0.35"/>

  <!-- Main Window Body -->
  <rect x="40" y="25" width="1120" height="290" rx="12" fill="#050814" fill-opacity="0.94" stroke="#1e293b" stroke-width="1.5" filter="url(#card-shadow)"/>

  <!-- Terminal Header -->
  <path d="M 40 37 A 12 12 0 0 1 52 25 L 1148 25 A 12 12 0 0 1 1160 37 L 1160 60 L 40 60 Z" fill="#0b0f19" stroke="#1e293b" stroke-width="0.5"/>
  
  <!-- Window Controls -->
  <circle cx="65" cy="42" r="6" fill="#ef4444" />
  <circle cx="85" cy="42" r="6" fill="#eab308" />
  <circle cx="105" cy="42" r="6" fill="#22c55e" />

  <!-- Terminal Title -->
  <text x="600" y="46" text-anchor="middle" class="terminal-title">aashish@sachdeva:~/language-metrics</text>

  <!-- Card Content -->
  
  <text x="75" y="95" class="prompt-text" filter="url(#glow)">> npx get-top-languages</text>

  <!-- Segmented Multi-Color Progress Bar -->
  <g>
    <rect x="75" y="120" width="1050" height="16" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <clipPath id="bar-clip">
      <rect x="75" y="120" width="1050" height="16" rx="8"/>
    </clipPath>
    <g clip-path="url(#bar-clip)">
      <rect x="75.00" y="120" width="715.93" height="16" fill="#DA5B0B"/>
<rect x="790.93" y="120" width="124.71" height="16" fill="#f1e05a"/>
<rect x="915.63" y="120" width="106.22" height="16" fill="#3178c6"/>
<rect x="1021.85" y="120" width="53.84" height="16" fill="#3572A5"/>
<rect x="1075.69" y="120" width="18.21" height="16" fill="#e34c26"/>
<rect x="1093.89" y="120" width="10.97" height="16" fill="#663399"/>

    </g>
  </g>

  <!-- Language Grid Cards -->
  
    <g transform="translate(75, 155)">
      <rect x="0" y="0" width="330" height="48" rx="8" class="tile-bg" stroke="#DA5B0B" stroke-opacity="0.6"/>
      <circle cx="20" cy="24" r="6" fill="#DA5B0B"/>
      <text x="35" y="29" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">Jupyter Notebook</text>
      <text x="315" y="29" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#DA5B0B">68.2%</text>
      <line x1="35" y1="36" x2="225.9" y2="36" stroke="#DA5B0B" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(435, 155)">
      <rect x="0" y="0" width="330" height="48" rx="8" class="tile-bg" stroke="#f1e05a" stroke-opacity="0.6"/>
      <circle cx="20" cy="24" r="6" fill="#f1e05a"/>
      <text x="35" y="29" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">JavaScript</text>
      <text x="315" y="29" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f1e05a">11.9%</text>
      <line x1="35" y1="36" x2="68.3" y2="36" stroke="#f1e05a" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(795, 155)">
      <rect x="0" y="0" width="330" height="48" rx="8" class="tile-bg" stroke="#3178c6" stroke-opacity="0.6"/>
      <circle cx="20" cy="24" r="6" fill="#3178c6"/>
      <text x="35" y="29" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">TypeScript</text>
      <text x="315" y="29" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#3178c6">10.1%</text>
      <line x1="35" y1="36" x2="63.3" y2="36" stroke="#3178c6" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(75, 213)">
      <rect x="0" y="0" width="330" height="48" rx="8" class="tile-bg" stroke="#3572A5" stroke-opacity="0.6"/>
      <circle cx="20" cy="24" r="6" fill="#3572A5"/>
      <text x="35" y="29" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">Python</text>
      <text x="315" y="29" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#3572A5">5.1%</text>
      <line x1="35" y1="36" x2="49.4" y2="36" stroke="#3572A5" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(435, 213)">
      <rect x="0" y="0" width="330" height="48" rx="8" class="tile-bg" stroke="#e34c26" stroke-opacity="0.6"/>
      <circle cx="20" cy="24" r="6" fill="#e34c26"/>
      <text x="35" y="29" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">HTML</text>
      <text x="315" y="29" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e34c26">1.7%</text>
      <line x1="35" y1="36" x2="39.9" y2="36" stroke="#e34c26" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(795, 213)">
      <rect x="0" y="0" width="330" height="48" rx="8" class="tile-bg" stroke="#663399" stroke-opacity="0.6"/>
      <circle cx="20" cy="24" r="6" fill="#663399"/>
      <text x="35" y="29" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">CSS</text>
      <text x="315" y="29" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#663399">1.0%</text>
      <line x1="35" y1="36" x2="37.9" y2="36" stroke="#663399" stroke-width="2" stroke-linecap="round"/>
    </g>
    

  <!-- Footer Status -->
  <text x="75" y="292" class="status-text-green">> language breakdown: Analyzed across user repositories</text>


</svg>