<svg
  xmlns="http://www.w3.org/2000/svg"
  width="495"
  height="195"
  viewBox="0 0 495 195"
  role="img"
  aria-label="GitHub streak statistics">

  <rect
    width="100%"
    height="100%"
    rx="10"
    fill="#0d1117"
    stroke="#30363d"
  />

  <text
    x="25"
    y="42"
    fill="#58a6ff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700">
    GitHub Streak
  </text>

  <text
    x="25"
    y="78"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14">
    Current streak
  </text>

  <text
    x="25"
    y="113"
    fill="#f0f6fc"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="700">
    242 days
  </text>

  <text
    x="260"
    y="78"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14">
    Longest streak
  </text>

  <text
    x="260"
    y="113"
    fill="#f0f6fc"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="700">
    242 days
  </text>

  <text
    x="25"
    y="158"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13">
    774 contributions in the last year
  </text>

  <text
    x="25"
    y="180"
    fill="#484f58"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11">
    Updated automatically every 6 hours
  </text>

</svg>
